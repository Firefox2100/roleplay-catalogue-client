name: Code Analysis with SonarQube

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: code-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Tests and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        id: frontend-tests
        continue-on-error: true
        run: npm run test:ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Convert frontend test results for SonarQube
        if: always() && hashFiles('test-results.xml') != ''
        run: python scripts/junit_to_sonar.py test-results.xml test-results-sonar.xml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust tests with coverage
        id: rust-tests
        continue-on-error: true
        working-directory: src-tauri
        run: cargo llvm-cov --lcov --output-path ../coverage/rust-lcov.info nextest --profile ci

      - name: Extract version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        if: steps.frontend-tests.outcome == 'success' && steps.rust-tests.outcome == 'success' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        with:
          args: >
            -Dsonar.projectVersion=${{ env.VERSION }}

      - name: Publish test results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16
        if: always() && hashFiles('test-results.xml', 'src-tauri/target/nextest/ci/junit.xml') != ''
        with:
          report_paths: |
            test-results.xml
            src-tauri/target/nextest/ci/junit.xml
          require_tests: true

      - name: Publish frontend coverage
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && hashFiles('coverage/coverage-summary.json') != ''

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('test-results.xml', 'test-results-sonar.xml', 'src-tauri/target/nextest/ci/junit.xml', 'coverage/**') != ''
        with:
          name: test-and-coverage-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            test-results.xml
            test-results-sonar.xml
            src-tauri/target/nextest/ci/junit.xml
            coverage/

      - name: Report skipped SonarQube scan
        if: steps.frontend-tests.outcome == 'success' && steps.rust-tests.outcome == 'success' && env.SONAR_TOKEN == ''
        run: echo "Tests passed, but SONAR_TOKEN is unavailable; reports were published without running the scan."

      - name: Enforce test results
        if: always() && (steps.frontend-tests.outcome != 'success' || steps.rust-tests.outcome != 'success')
        run: |
          echo "One or more test suites failed. See the published test reports."
          exit 1
