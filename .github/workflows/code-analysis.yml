name: Code Analysis with SonarQube

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: code-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Tests and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        id: frontend_tests
        continue-on-error: true
        run: npm run test:ci

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Convert frontend test results for SonarQube
        id: frontend_sonar_report
        if: always() && hashFiles('test-results.xml') != ''
        continue-on-error: true
        run: python scripts/junit_to_sonar.py test-results.xml test-results-sonar.xml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov

      - name: Run Rust tests with coverage
        id: rust_tests
        continue-on-error: true
        working-directory: src-tauri
        run: cargo llvm-cov --lcov --output-path ../coverage/rust-lcov.info nextest --profile ci

      - name: Extract version
        id: project_version
        continue-on-error: true
        run: node -e 'process.stdout.write(`VERSION=${require("./package.json").version}\n`)' >> "$GITHUB_ENV"

      - name: SonarQube Scan
        if: always() && steps.frontend_tests.outcome == 'success' && steps.frontend_sonar_report.outcome == 'success' && steps.rust_tests.outcome == 'success' && steps.project_version.outcome == 'success' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.projectVersion=${{ env.VERSION }}

      - name: Publish frontend test results
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: always() && hashFiles('test-results.xml') != ''
        with:
          check_name: Frontend test results
          report_paths: test-results.xml
          include_passed: true
          require_tests: true

      - name: Publish Rust test results
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: always() && hashFiles('src-tauri/target/nextest/ci/junit.xml') != ''
        with:
          check_name: Rust test results
          report_paths: src-tauri/target/nextest/ci/junit.xml
          include_passed: true
          require_tests: true

      - name: Publish frontend coverage
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        if: always() && hashFiles('coverage/coverage-summary.json') != ''

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('test-results.xml', 'test-results-sonar.xml', 'src-tauri/target/nextest/ci/junit.xml', 'coverage/**') != ''
        with:
          name: test-and-coverage-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            test-results.xml
            test-results-sonar.xml
            src-tauri/target/nextest/ci/junit.xml
            coverage/

      - name: Report skipped SonarQube scan
        if: always() && steps.frontend_tests.outcome == 'success' && steps.frontend_sonar_report.outcome == 'success' && steps.rust_tests.outcome == 'success' && steps.project_version.outcome == 'success' && env.SONAR_TOKEN == ''
        run: echo "Tests passed, but SONAR_TOKEN is unavailable; reports were published without running the scan."

      - name: Enforce analysis preparation
        if: always() && ((steps.frontend_tests.outcome == 'success' && steps.frontend_sonar_report.outcome != 'success') || steps.project_version.outcome != 'success')
        run: |
          echo "SonarQube input preparation failed. See the preceding step output."
          exit 1

      - name: Enforce test results
        if: always() && (steps.frontend_tests.outcome != 'success' || steps.rust_tests.outcome != 'success')
        run: |
          echo "One or more test suites failed. See the published test reports."
          exit 1
