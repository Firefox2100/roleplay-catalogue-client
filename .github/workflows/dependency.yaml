name: Dependency Analysis with Dependency-Track

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Reached over Tailscale rather than the public hostname: Cloudflare's bot challenge
  # blocks GitHub-hosted runners. Traffic is encrypted by WireGuard, hence plain http.
  DT_HOSTNAME: 100.86.189.45
  DT_PORT: "9080"
  DT_PROTOCOL: http
  # Must still match the audience configured on the workload identity provider.
  DT_AUDIENCE: https://dependency.firefox2100.co.uk
  DT_PROVIDER: github-actions
  DT_SERVICE_ACCOUNT: github-roleplay-catalogue-client

jobs:
  analysis:
    name: Generate and upload SBOM for analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-cyclonedx

      - name: Extract version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Generate frontend SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@7.0.1 \
            --package-lock-only --omit dev \
            --spec-version 1.6 --output-format JSON \
            --output-file bom-frontend.json

      - name: Generate Rust SBOM
        working-directory: src-tauri
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --override-filename bom-rust
          mv bom-rust.json ../bom-rust.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            bom-frontend.json
            bom-rust.json

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.DT_HOSTNAME }}

      - name: Upload frontend SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@331f980a6eba119842052f447c54b09e4888b4c6 # v4.3.0
        with:
          server-hostname: ${{ env.DT_HOSTNAME }}
          port: ${{ env.DT_PORT }}
          protocol: ${{ env.DT_PROTOCOL }}
          workload-identity-provider: ${{ env.DT_PROVIDER }}
          service-account: ${{ env.DT_SERVICE_ACCOUNT }}
          oidc-audience: ${{ env.DT_AUDIENCE }}
          project-name: roleplay-catalogue-client
          project-version: ${{ env.VERSION }}
          project-tags: frontend,javascript
          bom-filename: bom-frontend.json
          auto-create: true
          is-latest: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload Rust SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@331f980a6eba119842052f447c54b09e4888b4c6 # v4.3.0
        with:
          server-hostname: ${{ env.DT_HOSTNAME }}
          port: ${{ env.DT_PORT }}
          protocol: ${{ env.DT_PROTOCOL }}
          workload-identity-provider: ${{ env.DT_PROVIDER }}
          service-account: ${{ env.DT_SERVICE_ACCOUNT }}
          oidc-audience: ${{ env.DT_AUDIENCE }}
          project-name: roleplay-catalogue-client-rust
          project-version: ${{ env.VERSION }}
          project-tags: rust,tauri
          bom-filename: bom-rust.json
          auto-create: true
          is-latest: ${{ github.ref == 'refs/heads/main' }}
